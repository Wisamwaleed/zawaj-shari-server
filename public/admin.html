<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>زواج شرعي - لوحة الإدارة</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: #0D0D0D;
    color: #F5F0E6;
    font-family: -apple-system, Segoe UI, Tahoma, Arial, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { color: #D4AF37; font-size: 22px; margin: 0 0 20px; text-align: center; }
  h2 { color: #D4AF37; font-size: 16px; margin: 28px 0 10px; }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 16px;
    padding: 20px;
  }
  input, select {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(212,175,55,0.35);
    color: #F5F0E6;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    width: 100%;
  }
  button {
    background: #D4AF37; color: #1A1400; font-weight: 800;
    border: none; border-radius: 999px; padding: 9px 16px;
    font-size: 13px; cursor: pointer;
  }
  button.secondary { background: rgba(255,255,255,0.1); color: #F5F0E6; }
  button.danger { background: #E11D48; color: #fff; }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
  .stat { flex: 1 1 140px; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 14px; text-align: center; }
  .stat b { display: block; font-size: 22px; color: #D4AF37; }
  .stat span { font-size: 12px; color: #A8A29E; }
  .item { border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 0; }
  .item:last-child { border-bottom: none; }
  .muted { color: #A8A29E; font-size: 12.5px; }
  .error { color: #ff8a80; font-size: 13px; margin-top: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(212,175,55,0.2); color: #D4AF37; }
  .badge.banned { background: rgba(179,70,58,0.3); color: #ff8a80; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  td, th { text-align: right; padding: 8px 6px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  #app { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
  .ph { background: rgba(0,0,0,0.3); border: 1px solid rgba(212,175,55,0.2); border-radius: 12px; overflow: hidden; }
  .ph .img { width: 100%; aspect-ratio: 3 / 4; background: #111 center/cover no-repeat; cursor: zoom-in; display: flex; align-items: center; justify-content: center; color: #A8A29E; font-size: 12px; }
  .ph .meta { padding: 8px; font-size: 12px; }
  .ph .meta b { display: block; font-size: 13px; }
  .ph .row { gap: 6px; margin-top: 6px; }
  .ph button { padding: 6px 10px; font-size: 11px; }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 10; flex-direction: column; gap: 12px; padding: 16px; }
  #viewer img { max-width: 100%; max-height: 80vh; border-radius: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>لوحة إدارة - زواج شرعي</h1>

  <div id="login" class="card" style="max-width:360px;margin:0 auto;">
    <h2 style="margin-top:0;">تسجيل دخول المشرف</h2>
    <div class="row" style="flex-direction:column;align-items:stretch;gap:10px;">
      <input id="loginEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="username" />
      <input id="loginPassword" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
      <button onclick="doLogin()">دخول</button>
    </div>
    <div id="loginError" class="error"></div>
  </div>

  <div id="app">
    <div class="stats">
      <div class="stat"><b id="statUsers">-</b><span>إجمالي المستخدمين</span></div>
      <div class="stat"><b id="statPending">-</b><span>بلاغات قيد المراجعة</span></div>
      <div class="stat"><b id="statBanned">-</b><span>حسابات موقَفة</span></div>
      <div class="stat"><b id="statMessages">-</b><span>رسائل غير مقروءة</span></div>
    </div>

    <h2>مراجعة الصور (الأحدث أولاً)</h2>
    <div class="card">
      <div class="row">
        <button class="secondary" onclick="loadPhotos(1)">تحديث</button>
        <span class="muted">احذف أي صورة غير لائقة، أو أوقف الحساب إن تكرّر ذلك.</span>
      </div>
      <div id="photosGrid" class="grid"></div>
      <div class="row" style="justify-content:center;margin-top:12px;">
        <button class="secondary" id="photosMore" style="display:none" onclick="loadPhotos(photosPage + 1)">المزيد</button>
      </div>
    </div>

    <h2>رسائل «تواصل معنا»</h2>
    <div class="card">
      <div class="row">
        <select id="messagesFilter" onchange="loadMessages()" style="width:auto;">
          <option value="unread">غير المقروءة</option>
          <option value="all">الكل</option>
        </select>
        <button class="secondary" onclick="loadMessages()">تحديث</button>
      </div>
      <div id="messagesList"></div>
    </div>

    <h2>البلاغات</h2>
    <div class="card">
      <div class="row">
        <select id="reportStatus" onchange="loadReports()" style="width:auto;">
          <option value="pending">قيد المراجعة</option>
          <option value="resolved">تمت المعالجة</option>
          <option value="dismissed">مرفوضة</option>
          <option value="all">الكل</option>
        </select>
        <button class="secondary" onclick="loadReports()">تحديث</button>
      </div>
      <div id="reportsList"></div>
    </div>

    <h2>بحث المستخدمين</h2>
    <div class="card">
      <div class="row">
        <input id="userSearch" placeholder="بريد إلكتروني أو اسم..." onkeydown="if(event.key==='Enter')searchUsers()" />
        <button onclick="searchUsers()">بحث</button>
      </div>
      <div id="usersList"></div>
    </div>

    <div class="row" style="justify-content:center;margin-top:30px;">
      <button class="secondary" onclick="logout()">تسجيل الخروج</button>
    </div>
  </div>
</div>

<div id="viewer" onclick="closeViewer()">
  <img id="viewerImg" alt="" />
  <div class="muted">اضغط في أي مكان للإغلاق</div>
</div>

<script>
  var TOKEN_KEY = 'zawaj_admin_token';
  function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
  function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
  function clearToken() { localStorage.removeItem(TOKEN_KEY); }

  async function api(path, opts) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    var t = getToken();
    if (t) headers.Authorization = 'Bearer ' + t;
    var res = await fetch('/api' + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    var data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      var err = new Error(data.error || ('خطأ ' + res.status));
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  async function doLogin() {
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try {
      var r = await api('/auth/login', { method: 'POST', body: { email: email, password: password } });
      setToken(r.token);
      await enterApp();
    } catch (e) {
      errEl.textContent = e.message;
    }
  }

  async function enterApp() {
    try {
      await loadStats();
    } catch (e) {
      if (e.status === 403) {
        document.getElementById('loginError').textContent = 'هذا الحساب لا يملك صلاحية إشراف.';
        clearToken();
        return;
      }
      document.getElementById('loginError').textContent = e.message;
      clearToken();
      return;
    }
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadReports();
    loadMessages();
    loadPhotos(1);
  }

  function logout() {
    clearToken();
    document.getElementById('app').style.display = 'none';
    document.getElementById('login').style.display = 'block';
  }

  async function loadStats() {
    var s = await api('/admin/stats');
    document.getElementById('statUsers').textContent = s.totalUsers;
    document.getElementById('statPending').textContent = s.pendingReports;
    document.getElementById('statBanned').textContent = s.bannedUsers;
    document.getElementById('statMessages').textContent = s.unreadMessages;
  }

  async function loadReports() {
    var status = document.getElementById('reportStatus').value;
    var el = document.getElementById('reportsList');
    el.innerHTML = '<p class="muted">جارِ التحميل...</p>';
    try {
      var r = await api('/admin/reports?status=' + encodeURIComponent(status));
      if (!r.reports.length) {
        el.innerHTML = '<p class="muted">لا توجد بلاغات.</p>';
        return;
      }
      el.innerHTML = r.reports.map(renderReport).join('');
    } catch (e) {
      el.innerHTML = '<p class="error">' + escapeHtml(e.message) + '</p>';
    }
  }

  // الصور خاصة: تُجلب بتوكن المشرف (لا رابط عام) ثم تُعرض كرابط blob مؤقت.
  var photoUrls = {};
  async function photoUrl(userId) {
    if (photoUrls[userId]) return photoUrls[userId];
    var res = await fetch('/api/admin/users/' + userId + '/photo', {
      headers: { Authorization: 'Bearer ' + getToken() },
    });
    if (!res.ok) return null;
    photoUrls[userId] = URL.createObjectURL(await res.blob());
    return photoUrls[userId];
  }

  async function viewPhoto(userId) {
    var url = await photoUrl(userId);
    if (!url) { alert('لا توجد صورة لهذا المستخدم.'); return; }
    document.getElementById('viewerImg').src = url;
    document.getElementById('viewer').style.display = 'flex';
  }
  function closeViewer() { document.getElementById('viewer').style.display = 'none'; }

  var photosPage = 1;
  async function loadPhotos(page) {
    var grid = document.getElementById('photosGrid');
    if (page === 1) grid.innerHTML = '<p class="muted">جارِ التحميل...</p>';
    try {
      var r = await api('/admin/photos?page=' + page);
      photosPage = page;
      if (page === 1) grid.innerHTML = r.users.length ? '' : '<p class="muted">لا توجد صور.</p>';
      r.users.forEach(function (u) {
        var el = document.createElement('div');
        el.className = 'ph';
        el.id = 'ph-' + u.id;
        var ban = u.is_banned
          ? '<span class="badge banned">موقَف</span>'
          : '<button class="danger" onclick="banUser(' + u.id + ')">إيقاف</button>';
        el.innerHTML =
          '<div class="img" onclick="viewPhoto(' + u.id + ')">...</div>' +
          '<div class="meta"><b>' + escapeHtml(u.display_name || '-') + '</b>' +
          escapeHtml([u.gender === 'female' ? 'أنثى' : u.gender === 'male' ? 'ذكر' : '', u.age, u.city].filter(Boolean).join(' · ')) +
          '<div class="muted">' + escapeHtml(u.email) + '</div>' +
          '<div class="row"><button class="secondary" onclick="deletePhoto(' + u.id + ')">حذف الصورة</button>' + ban + '</div></div>';
        grid.appendChild(el);
        photoUrl(u.id).then(function (url) {
          var box = el.querySelector('.img');
          if (url) { box.style.backgroundImage = 'url(' + url + ')'; box.textContent = ''; }
          else box.textContent = 'تعذّر التحميل';
        });
      });
      document.getElementById('photosMore').style.display = r.hasMore ? 'inline-block' : 'none';
    } catch (e) {
      grid.innerHTML = '<p class="error">' + escapeHtml(e.message) + '</p>';
    }
  }

  async function deletePhoto(userId) {
    if (!confirm('حذف صورة هذا المستخدم نهائياً؟')) return;
    try {
      await api('/admin/users/' + userId + '/photo', { method: 'DELETE' });
      delete photoUrls[userId];
      var el = document.getElementById('ph-' + userId);
      if (el) el.remove();
      alert('تم حذف الصورة.');
    } catch (e) {
      alert(e.message);
    }
  }

  async function loadMessages() {
    var filter = document.getElementById('messagesFilter').value;
    var el = document.getElementById('messagesList');
    el.innerHTML = '<p class="muted">جارِ التحميل...</p>';
    try {
      var r = await api('/admin/contact-messages?filter=' + encodeURIComponent(filter));
      if (!r.messages.length) {
        el.innerHTML = '<p class="muted">لا توجد رسائل.</p>';
        return;
      }
      el.innerHTML = r.messages.map(function (m) {
        var when = new Date(m.created_at).toLocaleString('ar');
        var action = m.is_read
          ? '<span class="badge">مقروءة</span>'
          : '<button class="secondary" onclick="markMessageRead(' + m.id + ')">تعليم كمقروءة</button>';
        var reply = '<a href="mailto:' + encodeURIComponent(m.email) + '?subject=' +
          encodeURIComponent('رد من زواج شرعي') + '"><button>رد بالبريد</button></a>';
        return '<div class="item">' +
          '<div class="muted">' + when + '</div>' +
          '<div><b>' + escapeHtml(m.name) + '</b> (' + escapeHtml(m.email) + ')</div>' +
          '<div style="margin:6px 0;white-space:pre-wrap;">' + escapeHtml(m.message) + '</div>' +
          '<div class="row">' + reply + action + '</div>' +
        '</div>';
      }).join('');
    } catch (e) {
      el.innerHTML = '<p class="error">' + escapeHtml(e.message) + '</p>';
    }
  }

  async function markMessageRead(id) {
    try {
      await api('/admin/contact-messages/' + id + '/read', { method: 'POST' });
      loadMessages();
      loadStats();
    } catch (e) {
      alert(e.message);
    }
  }

  function renderReport(r) {
    var when = new Date(r.created_at).toLocaleString('ar');
    var actions = r.status === 'pending'
      ? '<button onclick="resolveReport(' + r.id + ',\'resolved\')">تمت المعالجة</button>' +
        '<button class="secondary" onclick="resolveReport(' + r.id + ',\'dismissed\')">تجاهل</button>'
      : '<span class="badge">' + (r.status === 'resolved' ? 'تمت المعالجة' : 'مرفوضة') + '</span>';
    var banBtn = r.reported_is_banned
      ? '<span class="badge banned">موقَف</span>'
      : '<button class="danger" onclick="banUser(' + r.reported_id + ')">إيقاف المُبلَّغ عنه</button>';
    return '<div class="item">' +
      '<div class="muted">' + when + ' · فئة: ' + escapeHtml(r.category || '-') + '</div>' +
      '<div><b>المُبلِّغ:</b> ' + escapeHtml(r.reporter_name || '-') + ' (' + escapeHtml(r.reporter_email) + ')</div>' +
      '<div><b>المُبلَّغ عنه:</b> ' + escapeHtml(r.reported_name || '-') + ' (' + escapeHtml(r.reported_email) + ')</div>' +
      '<div style="margin:6px 0;">' + escapeHtml(r.reason || '') + '</div>' +
      '<div class="row">' + actions + banBtn +
        '<button class="secondary" onclick="viewPhoto(' + r.reported_id + ')">صورة المُبلَّغ عنه</button></div>' +
    '</div>';
  }

  async function resolveReport(id, action) {
    try {
      await api('/admin/reports/' + id + '/resolve', { method: 'POST', body: { action: action } });
      loadReports();
      loadStats();
    } catch (e) {
      alert(e.message);
    }
  }

  async function banUser(id) {
    var reason = prompt('سبب الإيقاف (اختياري):') || '';
    try {
      await api('/admin/users/' + id + '/ban', { method: 'POST', body: { reason: reason } });
      loadReports();
      loadStats();
    } catch (e) {
      alert(e.message);
    }
  }

  async function unbanUser(id) {
    try {
      await api('/admin/users/' + id + '/unban', { method: 'POST' });
      searchUsers();
      loadStats();
    } catch (e) {
      alert(e.message);
    }
  }

  async function searchUsers() {
    var q = document.getElementById('userSearch').value.trim();
    var el = document.getElementById('usersList');
    el.innerHTML = '<p class="muted">جارِ البحث...</p>';
    try {
      var r = await api('/admin/users?q=' + encodeURIComponent(q));
      if (!r.users.length) {
        el.innerHTML = '<p class="muted">لا نتائج.</p>';
        return;
      }
      el.innerHTML = '<table><thead><tr><th>الاسم</th><th>البريد</th><th>الحالة</th><th></th></tr></thead><tbody>' +
        r.users.map(function (u) {
          var badge = u.is_banned ? '<span class="badge banned">موقَف</span>' : '<span class="badge">نشط</span>';
          var btn = u.is_banned
            ? '<button class="secondary" onclick="unbanUser(' + u.id + ')">رفع الإيقاف</button>'
            : '<button class="danger" onclick="banUser(' + u.id + ')">إيقاف</button>';
          if (u.has_photo) {
            btn += ' <button class="secondary" onclick="viewPhoto(' + u.id + ')">الصورة</button>' +
              ' <button class="secondary" onclick="deletePhoto(' + u.id + ')">حذف الصورة</button>';
          }
          return '<tr><td>' + escapeHtml(u.display_name || '-') + '</td><td>' + escapeHtml(u.email) +
            '</td><td>' + badge + '</td><td>' + btn + '</td></tr>';
        }).join('') + '</tbody></table>';
    } catch (e) {
      el.innerHTML = '<p class="error">' + escapeHtml(e.message) + '</p>';
    }
  }

  if (getToken()) enterApp();
</script>
</body>
</html>
